services:
  api:
    build: .
    container_name: forecasting-engine-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AI_ENABLED=${AI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: forecasting-engine-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - AI_ENABLED=${AI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true